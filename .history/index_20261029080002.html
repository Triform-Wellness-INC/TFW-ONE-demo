 0;color:var(--green)}#tfw-phone-demo .row{display:flex;align-items:center;justify-content:space-between;gap:12px}#tfw-phone-demo label{display:grid;gap:7px;margin-bottom:16px;color:var(--muted)}#tfw-phone-demo input,#tfw-phone-demo textarea,#tfw-phone-demo select{font:inherit;font-size:18px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:50px;padding:10px;width:100%}#tfw-phone-demo input[type=checkbox]{width:28px;min-height:28px;accent-color:var(--green)}#tfw-phone-demo .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}#tfw-phone-demo .switch{display:flex;align-items:center;gap:12px;color:var(--ink);margin:20px 0}#tfw-phone-demo .set{display:flex;gap:8px;margin:18px 0}#tfw-phone-demo .set button{flex:1}#tfw-phone-demo button[aria-pressed=true]{background:var(--green);color:var(--on)}#tfw-phone-demo nav{display:flex;justify-content:space-around;padding:8px 6px 18px;border-top:1px solid var(--line);background:var(--panel)}#tfw-phone-demo nav button{display:grid;justify-items:center;gap:4px;border:0;background:transparent;font-size:12px;padding:6px;min-width:58px}#tfw-phone-demo nav button.active{color:var(--green);background:var(--paper)}#tfw-phone-demo .notice{padding:12px 16px;background:var(--panel);color:var(--green);border-bottom:1px solid var(--line)}#tfw-phone-demo .homebar{width:100px;height:4px;background:var(--ink);border-radius:8px;margin:0 auto 8px}#tfw-phone-demo .listrow{padding:14px 0;border-bottom:1px solid var(--line)}#tfw-phone-demo .muted{color:var(--muted)}#tfw-phone-demo .progress{height:7px;border-radius:8px;overflow:hidden;background:var(--line);margin:18px 0}#tfw-phone-demo .progress span{display:block;height:100%;background:var(--green)}#tfw-phone-demo button:focus-visible{outline:3px solid var(--green);outline-offset:3px}

function drawHistory(c){return `${c.sessions.map(s=>`<section class="box"><small>${date} · WORKOUT</small><h3>${esc(s.title)}</h3><p>${s.sets.filter(x=>x.done).length} completed ${s.sets.filter(x=>x.done).length===1?"set":"sets"}</p><details><summary>View sets</summary>${s.sets.filter(x=>x.done).map(x=>`<p>${esc(x.title)} · Set ${x.number}: ${x.reps} reps × ${x.load} kg</p>`).join('')}</details><p>${esc(s.notes)}</p>${role==='client'?btn('Edit saved session','edit-session:'+c.sessions.indexOf(s)):''}</section>`).join('')}${c.diarySaved?`<section class="box"><small>${date} · DIARY</small><h3>Energy ${esc(c.diary.energy)} / 5</h3>${[['weight','Weight (kg)'],['calories','Calories eaten (kcal)'],['protein','Protein (g)'],['water','Water (litres)'],['sleep','Sleep (hours)']].filter(([k])=>c.diary[k]!=='').map(([k,l])=>`<div class="row"><span>${l}</span><strong>${esc(c.diary[k])}</strong></div>`).join('')}<p>${esc(c.diary.notes||'No notes added.')}</p>${role==='client'?btn('Edit diary entry','diary'):''}</section>`:''}${!c.sessions.length&&!c.diarySaved?'<p class="muted">No sample records yet.</p>':''}`;}
function render(){
persist();
const clientPicker=root.querySelector('#tfw-client-picker');clientPicker.innerHTML=Object.entries(clients).map(([id,c])=>`<option value="${id}" ${id===clientId?'selected':''}>${esc(c.name)}</option>`).join('');
const c=current(),client=role==='client',coach=role==='coach',management=role==='manager'||role==='pilot';
const items=client?[['home','Home','house'],['workout','Train','dumbbell'],['diary','Diary','notebook-pen'],['history','History','clock'],['sharing','Sharing','shield-check']]:coach?[['home','Today','house'],['clients','Clients','users'],['builder','Programs','dumbbell']]:[['home','Overview','house'],['team','Team','users'],['website','Website','image'],['builder','Programs','dumbbell'],['clients','Clients','heart-handshake']];
nav.innerHTML=items.map(([id,label,icon])=>`<button type="button" class="cursor-interaction ${page===id?'active':''}" data-action="${id}" ${page===id?'aria-current="page"':''}><i data-lucide="${icon}" aria-hidden="true"></i>${label}</button>`).join('');
let html='';
if(coach&&!activeCoach){html=`<span class="eyebrow">COACH ACCESS</span><h1>This staff account is deactivated.</h1><p>The owner can reactivate it from Team access. Client records and program tools are unavailable.</p>${btn('Explore owner preview','owner-preview',true)}`;}
else{
if(page==='home'&&client)html=`<span class="eyebrow">YOUR WELLNESS, CONNECTED</span><h1>A little more<br>you, ${esc(c.name.split(' ')[0])}.</h1><p class="muted">Your next step, at your pace.</p><div class="hero"><small>YOUR COACH’S PLAN</small><h2>${esc(c.plans[0]?.title||'A fresh start.')}</h2><p>${c.plans[0]?c.plans[0].exercises.length+' exercises · at your pace':'Your coach can assign your first workout.'}</p>${btn(c.plans.length?'Open my workout':'My programs','workout',true)}</div><h3>Your daily check-in</h3><p class="muted">${c.diarySaved?'Today’s entry is saved. Edit it whenever you need.':'Record what matters to you.'}</p>${btn(c.diarySaved?'View today’s diary →':'Add today’s diary →','diary')}<div class="box"><div class="row"><span>Coach sharing</span><strong>${c.sharing.coach&&activeCoach?'On':'Off'}</strong></div><p class="muted">${c.sharing.coach&&activeCoach?'Jordan can review your journal.':'Your journal is private from Jordan.'}</p>${btn('Manage sharing','sharing')}</div>`;
if(page==='home'&&!client)html=`<span class="eyebrow">${esc(role.toUpperCase())} WORKSPACE</span><h1>${coach?'Your clients.<br>Your next steps.':'Keep your team<br>moving.'}</h1><p class="muted">${coach?'Plan workouts and review what clients choose to share.':'People, programs and your website.'}</p><div class="hero"><small>${coach?'ASSIGNED CLIENTS':'TFW ONE'}</small><h2>${coach?Object.keys(clients).length+' sample clients':'A connected practice.'}</h2><p>${coach?'Alex and Maya share with their coach. Sam’s journal starts private.':'Manage your business without editing code.'}</p>${btn(coach?'View clients':'Manage team',coach?'clients':'team',true)}</div>${btn('Create & assign a workout →','builder')}<div class="box"><h3>${coach?'Try the full journey':'Permission boundaries'}</h3><p class="muted">${coach?'Assign a program, switch to Client, record a set, then return here to review it.':role==='pilot'?'Only Pilot appoints managers. Pilot has no automatic access to private client journals.':'Managers manage staff and content. Journal access still needs client consent.'}</p></div>`;
if(page==='clients')html=`<span class="eyebrow">${coach?'ASSIGNED CLIENTS':'CLIENT OVERVIEW'}</span><h1>Care starts<br>with a person.</h1>${Object.entries(clients).map(([id,x])=>`<section class="box"><h3>${esc(x.name)}</h3><p>${x.plans.length} assigned ${x.plans.length===1?'program':'programs'}</p><p class="muted">Journal: ${role==='pilot'?'private':x.sharing[role]?'sharing enabled':'private'}</p>${btn('Open '+esc(x.name.split(' ')[0])+' →','client:'+id)}</section>`).join('')}`;
if(page==='review')html=`${btn('← All clients','clients')}<span class="eyebrow">CLIENT OVERVIEW</span><h1>${esc(c.name)}</h1><form id="tfw-profile" class="box"><label>Sample client name<input name="name" required maxlength="100" value="${esc(c.name)}"></label><button type="submit" class="primary cursor-interaction">Save sample profile</button></form><div class="box"><div class="row"><strong>Diary & results</strong><span>${canRead()?'Shared':'Private'}</span></div><p class="muted">${canRead()?'The client has enabled access for your staff role.':'The client controls journal access. No private measurements or notes are shown.'}</p></div>${canRead()?drawHistory(c):''}<h3>Assigned programs</h3>${c.plans.map(p=>`<section class="box"><h3>${esc(p.title)}</h3><p>${p.exercises.length} ${p.exercises.length===1?"exercise":"exercises"}</p><details><summary>Prescription details</summary>${p.exercises.map(x=>`<p>${esc(x.title)} · ${x.sets} × ${x.reps} reps · ${x.load} kg<br><span class="muted">${esc(x.instructions)}</span></p>`).join('')}</details>${btn('Edit sample plan','edit-plan:'+p.id)}</section>`).join('')||'<p>No program yet.</p>'}${btn('Assign a new workout','new-plan',true)}${btn('Open this client’s sample view →','client-preview')}`;
if(page==='builder')html=`<span class="eyebrow">PROGRAM BUILDER</span><h1>A useful plan.<br>A clear next step.</h1><form id="tfw-plan"><label>Client<select name="client">${Object.entries(clients).map(([id,x])=>`<option value="${id}" ${builderClient===id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>Workout title<input name="title" value="${esc(builderTitle)}" required maxlength="120"></label>${builder.map((x,i)=>`<fieldset class="box"><legend>Exercise ${i+1}</legend><label>Exercise name<input name="exercise-${i}" value="${esc(x.title)}" required maxlength="120"></label><div class="two">${[['sets','Sets',1,20,1],['reps','Target reps',0,1000,1],['load','Target kg',0,1000,.5],['rest','Rest (seconds)',0,3600,1]].map(([k,l,min,max,step])=>`<label>${l}<input name="${k}-${i}" type="number" min="${min}" max="${max}" step="${step}" value="${x[k]}" required></label>`).join('')}</div><label>Coaching notes<textarea name="notes-${i}" rows="2" maxlength="1500">${esc(x.instructions)}</textarea></label>${builder.length>1?btn('Remove exercise','remove:'+i):''}</fieldset>`).join('')}${builder.length<10?btn('+ Add exercise','add-exercise'):''}<p class="muted">Assigning creates a new sample plan. Previous plans and session records stay available.</p><button type="submit" class="primary cursor-interaction">${editingPlan?'Save sample plan':'Assign workout'}</button></form>`;
if(page==='workout')html=`<span class="eyebrow">MY PROGRAMS</span><h1>Move with<br>confidence.</h1>${c.plans.map(p=>`<section class="box"><h2>${esc(p.title)}</h2>${p.exercises.map(x=>`<h3>${esc(x.title)}</h3><p>${x.sets} sets × ${x.reps} reps · ${x.load} kg<br><span class="muted">${x.rest}s rest · ${esc(x.instructions)}</span></p>`).join('')}${btn('Record this workout','start:'+p.id,true)}</section>`).join('')||'<p>Your coach can assign a workout from the Coach preview.</p>'}`;
if(page==='session'&&recording){const x=recording.exercises[exerciseIndex],sets=recording.sets.filter(s=>s.exercise===exerciseIndex),done=recording.sets.filter(s=>s.done).length;html=`${btn('← My programs','workout')}<span class="eyebrow">EXERCISE ${exerciseIndex+1} OF ${recording.exercises.length}</span><h1>${esc(x.title)}</h1><p class="muted">Target: ${x.sets} × ${x.reps} reps · ${x.load} kg</p><p>${esc(x.instructions)}</p><div class="progress" aria-label="${done} of ${recording.sets.length} sets completed"><span style="width:${done/recording.sets.length*100}%"></span></div>${sets.map(s=>`<fieldset class="box"><legend>Set ${s.number}</legend><div class="two"><label>Actual reps<input data-log="reps" data-index="${s.index}" type="number" min="0" max="1000" step="1" value="${s.reps}" required></label><label>Load (kg)<input data-log="load" data-index="${s.index}" type="number" min="0" max="1000" step=".5" value="${s.load}" required></label></div><label class="switch"><input data-done="${s.index}" type="checkbox" ${s.done?'checked':''}>Completed this set</label></fieldset>`).join('')}<div class="row">${exerciseIndex>0?btn('← Previous','previous'):''}${exerciseIndex<recording.exercises.length-1?btn('Next exercise →','next'):''}</div><label>Session notes<textarea id="tfw-session-notes" maxlength="2000" rows="2">${esc(recording.notes)}</textarea></label>${btn('Save workout','finish',true)}`;}
if(page==='saved')html=`<span class="eyebrow">WORKOUT SAVED</span><h1>You showed up.<br>That counts.</h1><div class="box"><h2>${c.sessions[c.sessions.length-1]?.sets.filter(x=>x.done).length||0} completed sets</h2><p>${esc(c.sessions[c.sessions.length-1]?.title||'Workout')}</p><p class="muted">Saved on this device. Use Reset samples to start again.</p></div>${btn('How did today feel?','diary',true)}${btn('View history →','history')}`;
if(page==='diary')html=`<span class="eyebrow">DAILY JOURNAL</span><h1>How are you<br>feeling?</h1><p class="muted">Optional observations, at your pace.</p><form id="tfw-diary"><label>Energy<select name="energy">${[1,2,3,4,5].map(n=>`<option value="${n}" ${c.diary.energy==n?'selected':''}>${n} · ${['Very low','Low','Okay','Good','Great'][n-1]}</option>`).join('')}</select></label><label>Your notes<textarea name="notes" maxlength="4000" rows="3" placeholder="What went well?">${esc(c.diary.notes)}</textarea></label><details class="box"><summary>Optional body & nutrition details</summary><div style="margin-top:16px">${[['weight','Weight (kg)',1000],['calories','Calories eaten (kcal)',20000],['protein','Protein (g)',2000],['water','Water (litres)',30],['sleep','Sleep (hours)',24]].map(([k,l,max])=>`<label>${l}<input name="${k}" type="number" min="0" max="${max}" step=".1" value="${esc(c.diary[k])}" inputmode="decimal"></label>`).join('')}</div></details><p class="muted">${c.sharing.coach&&activeCoach?'Jordan can see this journal because sample sharing is enabled.':'Private from Jordan.'}</p><button class="primary cursor-interaction" type="submit">Save today’s diary</button></form>`;
if(page==='history')html=`<span class="eyebrow">MY HISTORY</span><h1>Every small step.</h1>${drawHistory(c)}${btn('My workouts →','workout',true)}`;
if(page==='sharing')html=`<span class="eyebrow">YOUR PRIVACY</span><h1>Your diary.<br>Your choice.</h1><p>Choose who can see your diary and workout results.</p><div class="box"><h3>Jordan Lee</h3><p class="muted">${activeCoach?'Assigned coach':'Coach access deactivated'}</p><label class="switch"><input data-share="coach" type="checkbox" ${c.sharing.coach&&activeCoach?'checked':''} ${activeCoach?'':'disabled'}>Share with Jordan</label></div><div class="box"><h3>Manager</h3><label class="switch"><input data-share="manager" type="checkbox" ${c.sharing.manager?'checked':''}>Share with manager</label></div><p class="muted">Sharing includes past and future entries. Turning it off stops new access, but cannot recall downloaded copies. Sample choices apply in this preview only.</p>${btn('Back to my day','home',true)}`;
if(page==='team')html=`<span class="eyebrow">TEAM ACCESS</span><h1>The right people.<br>The right access.</h1>${staff.map((s,i)=>`<section class="box"><h3>${esc(s.name)}</h3><p>${esc(s.role)} · ${i===0?(activeCoach?'Active':'Deactivated'):'Invitation pending'}</p><p class="muted">${esc(s.email)}</p>${i===0?btn(activeCoach?'Deactivate coach':'Reactivate coach','toggle-staff'):''}</section>`).join('')}<form id="tfw-staff"><label>New staff name<input name="name" required maxlength="80"></label><label>Email<input name="email" type="email" required maxlength="254" placeholder="Use a sample address"></label><label>Role<select name="role"><option>Employee</option>${role==='pilot'?'<option>Owner / Manager</option>':''}</select></label><button class="primary cursor-interaction" type="submit">Add sample invitation</button></form><p class="muted">No invitation emails are sent. Only Pilot can appoint managers.</p>`;
if(page==='website')html=`<span class="eyebrow">WEBSITE STUDIO</span><h1>Keep it current.</h1><div class="box"><h3>Services</h3>${services.map(s=>`<div class="listrow">${esc(s)}</div>`).join('')}</div><form id="tfw-service"><label>New service<input name="title" required maxlength="80"></label><button class="primary cursor-interaction" type="submit">Add to sample draft</button></form><p class="muted">The real website uses draft → preview → publish. These changes are sample data only.</p>`;
}
screen.innerHTML=html;root.querySelector('.sample').innerHTML=`${esc(c.name.split(' ')[0])} · ${esc(role)}<br>Sample data only`;if(typeof lucide!=='undefined')lucide.createIcons();
}
function readBuilder(){const f=root.querySelector('#tfw-plan');if(!f)return;const d=new FormData(f);builderTitle=String(d.get('title'));builderClient=String(d.get('client'));builder=builder.map((x,i)=>({title:String(d.get('exercise-'+i)),sets:Number(d.get('sets-'+i)),reps:Number(d.get('reps-'+i)),load:Number(d.get('load-'+i)),rest:Number(d.get('rest-'+i)),instructions:String(d.get('notes-'+i))}));}
function saveRecordingFields(){if(!recording)return;root.querySelectorAll('[data-log]').forEach(i=>{recording.sets[Number(i.dataset.index)][i.dataset.log]=Number(i.value);});const n=root.querySelector('#tfw-session-notes');if(n)recording.notes=n.value;}
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
if(a==='new-plan'){editingPlan=null;builderClient=clientId;go('builder');return;}
if(a.startsWith('edit-plan:')){const p=current().plans.find(x=>x.id===a.slice(10));if(!p)return;editingPlan=p.id;builderClient=clientId;builderTitle=p.title;builder=clone(p.exercises);go('builder');return;}
if(a.startsWith('edit-session:')){const i=Number(a.slice(13));const saved=current().sessions[i];if(!saved)return;recording=clone(saved);recording.sets.forEach((x,n)=>x.index=n);recording.editIndex=i;exerciseIndex=0;go('session');return;}
if(a==='client-preview'){setRole('client');return;}if(a==='owner-preview'){setRole('pilot');return;}
if(a.startsWith('client:')){clientId=a.slice(7);builderClient=clientId;go('review');return;}
if(a==='add-exercise'||a.startsWith('remove:')){readBuilder();if(a==='add-exercise')builder.push({title:'',sets:3,reps:10,load:0,rest:60,instructions:''});else builder.splice(Number(a.slice(7)),1);render();return;}
if(a.startsWith('start:')){const p=current().plans.find(x=>x.id===a.slice(6));if(!p)return;recording={title:p.title,exercises:clone(p.exercises),sets:p.exercises.flatMap((x,i)=>Array.from({length:x.sets},(_,j)=>({title:x.title,exercise:i,number:j+1,reps:x.reps,load:x.load,done:false}))),notes:''};recording.sets.forEach((x,i)=>x.index=i);exerciseIndex=0;go('session');return;}
if(a==='next'||a==='previous'||a==='finish'){if(!recording)return;saveRecordingFields();if(recording.sets.some(x=>!Number.isFinite(x.reps)||!Number.isInteger(x.reps)||x.reps<0||x.reps>1000||!Number.isFinite(x.load)||x.load<0||x.load>1000))return say('Check your reps and load');if(a==='finish'){if(Number.isInteger(recording.editIndex))current().sessions[recording.editIndex]=clone(recording);else current().sessions.push(clone(recording));recording=null;go('saved');}else{exerciseIndex+=a==='next'?1:-1;go('session');}return;}
if(a==='toggle-staff'){activeCoach=!activeCoach;if(!activeCoach)Object.values(clients).forEach(c=>c.sharing.coach=false);render();say(activeCoach?'Coach reactivated; client sharing stays off':'Coach deactivated; journal sharing revoked');return;}go(a);
});
root.addEventListener('change',e=>{if(e.target===rolePicker)setRole(e.target.value);if(e.target.id==='tfw-client-picker'){clientId=e.target.value;builderClient=clientId;recording=null;go(role==='client'?'home':'review');}if(e.target.dataset.share){current().sharing[e.target.dataset.share]=e.target.checked;persist();say(e.target.checked?'Sample sharing enabled':'Sample sharing revoked');}if(e.target.dataset.done!==undefined&&recording)recording.sets[Number(e.target.dataset.done)].done=e.target.checked;});
root.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);if(e.target.id==='tfw-profile'){current().name=String(f.get('name'));render();say('Sample profile updated');}if(e.target.id==='tfw-plan'){readBuilder();clientId=builderClient;const plan={id:editingPlan||'plan-'+Date.now(),title:builderTitle,exercises:clone(builder)};const pi=current().plans.findIndex(p=>p.id===editingPlan);if(pi>=0)current().plans[pi]=plan;else current().plans.unshift(plan);editingPlan=null;go('review');say('Workout assigned to '+current().name);}if(e.target.id==='tfw-diary'){Object.keys(current().diary).forEach(k=>current().diary[k]=String(f.get(k)||''));current().diarySaved=true;go('history');say('Diary saved');}if(e.target.id==='tfw-staff'){staff.push({name:String(f.get('name')),email:String(f.get('email')),role:String(f.get('role')),active:false});render();say('Sample staff invitation added');}if(e.target.id==='tfw-service'){services.push(String(f.get('title')));render();say('Service added to sample draft');}});
root.querySelector('#tfw-reset').addEventListener('click',()=>{if(confirm('Reset the fictional sample data on this device?')){try{localStorage.removeItem(storageKey);}catch{}location.reload();}});
render();
})();

</script>
</div>
